[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papyrus"
version = "0.2.0"
description = "CrewAI-powered research, writing, verification, and publishing pipeline for technical books"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["crewai>=1.12,<2", "python-dotenv>=1.0,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
papyrus = "bookgen.autopilot:main"
bookgen = "bookgen.cli:main"

[tool.setuptools]
packages = ["bookgen"]
