name: Papyrus offline tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install pytest
      - name: Compile and test without network or LLM keys
        run: |
          python -m compileall -q bookgen
          PYTHONPATH=. python -m pytest -q
